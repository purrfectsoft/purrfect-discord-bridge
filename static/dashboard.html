<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Purrfect Universe — Bridge</title>
  <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>
  <script>
  window.tailwind = window.tailwind || {};
  window.tailwind.config = {
    safelist: [
      "data-[show=true]:opacity-100",
      "data-[show=true]:translate-y-0",
      "min-w-[220px]",
      "data-[loading=true]:cursor-not-allowed",
      "data-[loading=true]:opacity-80"
    ],
    theme: {
      extend: {
        colors: {
          brand: {
            sky: {
              400: "#38bdf8",
              500: "#0ea5e9"
            },
            purple: {
              400: "#c084fc",
              500: "#a855f7"
            },
            emerald: {
              400: "#34d399",
              500: "#10b981"
            }
          }
        }
      }
    }
  };
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="absolute inset-0 -z-10 bg-[radial-gradient(circle_at_top,_rgba(56,189,248,0.08),transparent_55%)]"></div>
  <div class="mx-auto flex max-w-6xl flex-col gap-12 px-6 py-12 sm:px-8">
    <!--METRICS-->

    <section class="space-y-4">
      <h2 class="text-lg font-semibold text-slate-100">Post from Dashboard</h2>
      <!--FORMS-->
    </section>

    <footer class="pt-6 text-xs text-slate-500">
      Refreshed live every 30s
      • <a href="/health.json" class="text-slate-400 underline decoration-dotted underline-offset-4 hover:text-slate-200">/health.json</a>
      • Canonical: <!--CANONICAL-->
    </footer>
  </div>
  <div id="toastHost" class="pointer-events-none fixed bottom-6 right-6 z-50 flex max-w-full flex-col gap-3"></div>
  <script>
  (() => {
    const host = document.getElementById("toastHost");
    if (!host) return;

    const baseClass = [
      "toast pointer-events-auto flex min-w-[220px] items-start gap-3 rounded-2xl border border-slate-800/80 bg-slate-950/90 px-4 py-3 text-sm text-slate-200 shadow-2xl shadow-black/40 backdrop-blur transition duration-200 ease-out",
      "opacity-0 translate-y-3 data-[show=true]:opacity-100 data-[show=true]:translate-y-0"
    ].join(" ");
    const variants = {
      success: "border-brand-emerald-500/60 bg-brand-emerald-500/10 text-brand-emerald-100",
      error: "border-rose-500/70 bg-rose-500/10 text-rose-200",
      info: "border-slate-700/70 bg-slate-900/70"
    };

    function makeToast(message, variant = "info") {
      const toast = document.createElement("div");
      toast.className = `${baseClass} ${variants[variant] || variants.info}`;
      toast.textContent = message;
      toast.setAttribute("role", "status");
      return toast;
    }

    function parseMessage(raw) {
      if (!raw) return "";
      const trimmed = raw.trim();
      if (!trimmed) return "";
      try {
        const parser = new DOMParser();
        const doc = parser.parseFromString(trimmed, "text/html");
        const parsed = doc?.body?.textContent?.trim();
        return parsed || trimmed;
      } catch (error) {
        return trimmed;
      }
    }

    function toggleFormLoading(form, isLoading) {
      if (!(form instanceof HTMLFormElement)) return;
      const submit = form.querySelector('button[type="submit"]');
      if (!submit) return;
      const spinner = submit.querySelector('[data-dashboard-spinner]');
      const label = submit.querySelector('[data-dashboard-label]');
      const loading = Boolean(isLoading);
      submit.disabled = loading;
      submit.dataset.loading = loading ? "true" : "false";
      submit.setAttribute("aria-busy", loading ? "true" : "false");
      if (spinner) {
        spinner.classList.toggle("hidden", !loading);
      }
      if (label) {
        label.classList.toggle("opacity-60", loading);
      }
    }

    window.dashboardToggleFormLoading = (form, isLoading) => {
      toggleFormLoading(form, isLoading);
    };

    window.dashboardToast = (message, variant = "info") => {
      if (!message) return;
      const toast = makeToast(message, variant);
      host.appendChild(toast);
      requestAnimationFrame(() => {
        toast.dataset.show = "true";
      });
      const dismiss = () => {
        toast.dataset.show = "false";
        toast.addEventListener("transitionend", () => toast.remove(), { once: true });
      };
      setTimeout(dismiss, 4200);
    };

    window.dashboardHandleForm = (event, form) => {
      toggleFormLoading(form, false);
      const { successful, xhr } = event.detail || {};
      const responseText = xhr && typeof xhr.responseText === "string" ? xhr.responseText : "";
      const fallback = successful ? "Request sent successfully." : `Request failed${xhr?.status ? ` (status ${xhr.status})` : ""}.`;
      const message = parseMessage(responseText) || fallback;
      window.dashboardToast(message, successful ? "success" : "error");
      if (successful && form instanceof HTMLFormElement) {
        form.reset();
      }
    };
  })();
  </script>
</body></html>
